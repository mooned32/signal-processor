# Конфигурация Signal Processor.
# Файл всегда остаётся внешним и должен находиться рядом с исполняемым файлом.

# -----------------------------------------------------------------------------
# Контрольные частоты.
# Порядок значений во всех массивах соответствует порядку точек отчёта.
# -----------------------------------------------------------------------------
[frequency_constants]
number_of_constants = 20

# Центральные частоты, Гц.
f_i = [
    500, 1200, 2400, 3600, 5000,
    6500, 8000, 9500, 11000, 13000,
    15000, 17500, 19000, 21000, 23500,
    25000, 27000, 28500, 30000, 31500
]

# Полоса/контрольное значение для соответствующей точки, Гц.
delta_f_i = [
    500, 1200, 2400, 3600, 5000,
    6500, 8000, 9500, 11000, 13000,
    15000, 17500, 19000, 21000, 23500,
    25000, 27000, 28500, 30000, 31500
]

# Коэффициенты k для соответствующих контрольных частот.
k_i = [
    0.01, 0.01, 0.01, 0.01, 0.01,
    0.01, 0.01, 0.01, 0.01, 0.01,
    0.01, 0.01, 0.01, 0.01, 0.01,
    0.01, 0.01, 0.01, 0.01, 0.01
]

# Коэффициенты A для соответствующих контрольных частот.
delta_a_i = [
    1.12, 1.45, 1.89, 2.10, 2.55,
    3.01, 3.44, 3.80, 4.15, 4.60,
    5.05, 5.50, 6.12, 6.80, 7.25,
    7.90, 8.40, 9.10, 9.75, 10.50
]

# -----------------------------------------------------------------------------
# Нормированные параметры по категории объекта.
# -----------------------------------------------------------------------------
[norm_params_by_category]
delta_stn = [2.00, 5.00, 10.00]
w_n = [1000000.0, 2000000.0, 5000000.0]

# -----------------------------------------------------------------------------
# Нормированный шум для каждого типа исследуемой линии.
# Каждое значение соответствует одной контрольной частоте.
# -----------------------------------------------------------------------------
[norm_noise_by_line.symmetrical]
values = [
    1.12, 1.45, 1.89, 2.10, 2.55,
    3.01, 3.44, 3.80, 4.15, 4.60,
    5.05, 5.50, 6.12, 6.80, 7.25,
    7.90, 8.40, 9.10, 9.75, 10.50
]

[norm_noise_by_line.asymmetrical]
values = [
    1.12, 1.45, 1.89, 2.10, 2.55,
    3.01, 3.44, 3.80, 4.15, 4.60,
    5.05, 5.50, 6.12, 6.80, 7.25,
    7.90, 8.40, 9.10, 9.75, 10.50
]

[norm_noise_by_line.power]
values = [
    1.12, 1.45, 1.89, 2.10, 2.55,
    3.01, 3.44, 3.80, 4.15, 4.60,
    5.05, 5.50, 6.12, 6.80, 7.25,
    7.90, 8.40, 9.10, 9.75, 10.50
]

# -----------------------------------------------------------------------------
# Шаблоны названий исследуемых линий.
# Пара {} означает поле, которое пользователь заполняет в интерфейсе.
# -----------------------------------------------------------------------------
[line]

[line.symmetrical]
names = ["ЛВС, пара {} - {}"]

[line.asymmetrical]
names = ["Антенный кабель"]

[line.power]
names = ["Электропитание ({})", "Заземление"]

# Режимы работы, отображаемые в интерфейсе.
[operation_modes]
modes = ["ХХ", "ДР", "РР"]
