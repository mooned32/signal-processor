name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group build

      - name: Build with Nuitka
        run: |
          uv run --group build python -m nuitka `
            --standalone `
            --onefile `
            --enable-plugin=pyqt6 `
            --windows-console-mode=disable `
            --output-dir=dist `
            --output-filename=SignalProcessor.exe `
            --remove-output `
            --lto=no `
            main.py

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalProcessor-Windows
          path: dist/SignalProcessor.exe
