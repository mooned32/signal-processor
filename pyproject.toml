[project]
name = "signal-processor"
version = "0.2.0"
description = "Десктопное приложение для анализа спектров"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyqt6>=6.6.0",
    "pandas>=2.2.0",
    "numpy>=2.5.3",
    "pyinstaller>=6.5.0",
    "python-docx>=1.1.0",
]

[dependency-groups]
dev = ["pandas-stubs>=3.0.5.260730"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
